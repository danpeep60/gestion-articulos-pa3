<nav class="navbar navbar-expand-md navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" routerLink="/">Gestión de Artículos</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto align-items-md-center">
        <ng-container *ngIf="auth.user$ | async as usuario; else sinSesion">
          <li class="nav-item"><a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/articulos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Artículos</a></li>
          <li class="nav-item" *ngIf="usuario.rol === 'admin'"><a class="nav-link" routerLink="/articulos/nuevo" routerLinkActive="active">Nuevo artículo</a></li>
          <li class="nav-item"><span class="navbar-text mx-md-3">{{ usuario.nombre }} ({{ usuario.rol }})</span></li>
          <li class="nav-item"><button class="btn btn-outline-light btn-sm" (click)="auth.logout()">Cerrar sesión</button></li>
        </ng-container>
        <ng-template #sinSesion>
          <li class="nav-item"><a class="nav-link" routerLink="/login">Ingresar</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/register">Registrarse</a></li>
        </ng-template>
      </ul>
    </div>
  </div>
</nav>

<main class="container my-4">
  <router-outlet></router-outlet>
</main>
