<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Artículos</h2>
  <a *ngIf="auth.esAdmin()" routerLink="/articulos/nuevo" class="btn btn-primary">+ Nuevo</a>
</div>

<div *ngIf="mensaje" class="alert alert-success">{{ mensaje }}</div>
<div *ngIf="error" class="alert alert-danger">{{ error }}</div>

<div class="table-responsive">
  <table class="table table-striped align-middle">
    <thead class="table-dark">
      <tr>
        <th>Nombre</th>
        <th>Categoría</th>
        <th>Precio</th>
        <th>Descripción</th>
        <th *ngIf="auth.esAdmin()" class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of articulos">
        <td>{{ a.nombre }}</td>
        <td>{{ a.categoria }}</td>
        <td>{{ a.precio | currency:'PEN':'S/ ' }}</td>
        <td>{{ a.descripcion }}</td>
        <td *ngIf="auth.esAdmin()" class="text-end">
          <a [routerLink]="['/articulos/editar', a._id]" class="btn btn-sm btn-warning me-2">Editar</a>
          <button class="btn btn-sm btn-danger" (click)="eliminar(a)">Eliminar</button>
        </td>
      </tr>
      <tr *ngIf="articulos.length === 0">
        <td [attr.colspan]="auth.esAdmin() ? 5 : 4" class="text-center text-muted">No hay artículos registrados</td>
      </tr>
    </tbody>
  </table>
</div>
