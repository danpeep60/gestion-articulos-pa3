<h2 class="mb-3">{{ id ? 'Editar artículo' : 'Nuevo artículo' }}</h2>

<div *ngIf="mensaje" class="alert alert-success">{{ mensaje }}</div>
<div *ngIf="error" class="alert alert-danger">{{ error }}</div>

<form [formGroup]="form" (ngSubmit)="guardar()" class="row g-3">
  <div class="col-12 col-md-6">
    <label class="form-label">Nombre *</label>
    <input type="text" class="form-control" formControlName="nombre" [class.is-invalid]="campoInvalido('nombre')">
    <div class="invalid-feedback">El nombre es obligatorio (mínimo 3 caracteres).</div>
  </div>

  <div class="col-12 col-md-6">
    <label class="form-label">Categoría *</label>
    <input type="text" class="form-control" formControlName="categoria" [class.is-invalid]="campoInvalido('categoria')">
    <div class="invalid-feedback">La categoría es obligatoria.</div>
  </div>

  <div class="col-12 col-md-6">
    <label class="form-label">Precio (S/) *</label>
    <input type="number" step="0.01" class="form-control" formControlName="precio" [class.is-invalid]="campoInvalido('precio')">
    <div class="invalid-feedback">Ingresa un precio válido (mayor o igual a 0).</div>
  </div>

  <div class="col-12">
    <label class="form-label">Descripción</label>
    <textarea rows="3" class="form-control" formControlName="descripcion" [class.is-invalid]="campoInvalido('descripcion')"></textarea>
    <div class="invalid-feedback">Máximo 200 caracteres.</div>
  </div>

  <div class="col-12">
    <button type="submit" class="btn btn-success me-2">Guardar</button>
    <a routerLink="/articulos" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
