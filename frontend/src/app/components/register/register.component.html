<div class="mx-auto" style="max-width: 420px">
  <h2 class="mb-3">Crear cuenta</h2>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <form [formGroup]="form" (ngSubmit)="registrar()" class="row g-3">
    <div class="col-12">
      <label class="form-label">Nombre *</label>
      <input type="text" class="form-control" formControlName="nombre" [class.is-invalid]="campoInvalido('nombre')">
      <div class="invalid-feedback">El nombre es obligatorio (mínimo 3 caracteres).</div>
    </div>

    <div class="col-12">
      <label class="form-label">Correo *</label>
      <input type="email" class="form-control" formControlName="email" [class.is-invalid]="campoInvalido('email')">
      <div class="invalid-feedback">Ingresa un correo válido.</div>
    </div>

    <div class="col-12">
      <label class="form-label">Contraseña *</label>
      <input type="password" class="form-control" formControlName="password" [class.is-invalid]="campoInvalido('password')">
      <div class="invalid-feedback">La contraseña debe tener mínimo 6 caracteres.</div>
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-success w-100" [disabled]="cargando">
        {{ cargando ? 'Registrando...' : 'Registrarme' }}
      </button>
      <p class="mt-3 mb-0 text-center">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </div>
  </form>
</div>
